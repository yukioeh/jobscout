# The location segment of the resume contact line, chosen by the
# posting's location tier so an on-site or hybrid role sees the market
# it is hiring for. Home is Chagrin Falls, OH; remote and anything
# unmatched falls back to that.
#
# These state openness to relocation rather than residence in a city
# Eric does not live in yet. "Boston, MA" on its own would read as a
# current address and would not be true. Everything else in a generated
# document traces to a claim id and gets checked; this line does not,
# so it is written to be defensible on its face.
#
# Trailing "  •" is the separator before the phone number. Keep it.
location_lines:
  default:          "Chagrin Falls, OH  •  Open to remote or relocation  •"
  remote_us:        "Chagrin Falls, OH  •  Open to remote or relocation  •"
  cleveland:        "Chagrin Falls, OH  •  Open to remote  •"
  # Target-market address for the two markets Eric will move to, so a
  # screener filtering on location does not drop the application before
  # a person reads it. The move is real but not yet made, and the
  # cover letter closer is worded to commit to being on site rather
  # than to claim he already lives there.
  boston:           "Brookline, MA  •  Open to remote  •"
  bay_area:         "San Francisco, CA  •  Open to remote  •"
  # NYC stays on the home address: it is referral-track, and a referral
  # makes the location conversation directly rather than on paper.
  hybrid_northeast: "Chagrin Falls, OH  •  Open to remote or relocation  •"

# Requirements that never earn a row in the cover letter's T-table.
#
# The table holds three rows and fills them with the highest-scoring
# requirements, so anything table-stakes scores a 4 and crowds out the
# evidence that actually argues the case. "Fluency in English (spoken
# and written)" took a slot on a Lovable letter, answered by the claim
# that reads "Japanese, fluent, JLPT Level 2. English native." True,
# and worth nothing to a reader.
#
# This is presentation only. The requirement is still scored, still
# counts toward requirement_match, and still counts in must-have
# coverage. It just does not get argued in the letter.
cover_letter_skip:
  - "(?i)\\benglish\\b.{0,40}\\b(fluen|proficien)"
  - "(?i)\\b(fluen|proficien)\\w*\\b.{0,40}\\benglish\\b"

